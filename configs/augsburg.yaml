dataset: augsburg
data_root: data/processed/augsburg
output_root: outputs/augsburg
num_classes: 7
channels: [20, 4, 1]
patch_size: 11
class_names:
  - Forest
  - Residential Area
  - Industrial Area
  - Low Plants
  - Allotment
  - Commercial Area
  - Water
model:
  dim: 96
  state_dim: 16
  layers: 1
training:
  batch_size: 32
  epochs: 100
  learning_rate: 0.0005
  scalar_lr_multiplier: 10.0
  weight_decay: 0.0001
  label_smoothing: 0.1
  class_weight_max: 5.0
  minimum_lr: 0.000001
  gradient_clip: 1.0
  workers: 4
