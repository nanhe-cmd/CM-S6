dataset: houston
data_root: data/processed/houston
output_root: outputs/houston
num_classes: 15
channels: [20, 1]
patch_size: 11
class_names:
  - Healthy grass
  - Stressed grass
  - Synthetic grass
  - Trees
  - Soil
  - Water
  - Residential
  - Commercial
  - Road
  - Highway
  - Railway
  - Parking lot 1
  - Parking lot 2
  - Tennis court
  - Running track
model:
  dim: 96
  state_dim: 16
  layers: 1
training:
  batch_size: 64
  epochs: 100
  learning_rate: 0.0005
  scalar_lr_multiplier: 10.0
  weight_decay: 0.0001
  label_smoothing: 0.1
  class_weight_max: 5.0
  minimum_lr: 0.000001
  gradient_clip: 1.0
  workers: 4
