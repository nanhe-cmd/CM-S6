dataset: muufl
data_root: data/processed/muufl
output_root: outputs/muufl
num_classes: 11
channels: [20, 2]
patch_size: 11
class_names:
  - Trees
  - Grass mostly ground
  - Grass mixed ground
  - Tree and grass
  - Shadow
  - Buildings
  - Dirt/sand
  - Road
  - Sidewalk
  - Yellow curb
  - Cloth panels
model:
  dim: 96
  state_dim: 16
  layers: 1
training:
  batch_size: 64
  epochs: 100
  learning_rate: 0.0005
  scalar_lr_multiplier: 10.0
  weight_decay: 0.0001
  label_smoothing: 0.1
  class_weight_max: 5.0
  minimum_lr: 0.000001
  gradient_clip: 1.0
  workers: 4
